/* ===== 玩家格烟雾：一次性 fbm 纹理 + 每格摆动取样（20fps） =====
   纹理是域扭曲噪声，接近主页 shader 那套；每格只做一次 drawImage，
   10 个格子的成本远低于开 10 个 WebGL context。 */
(function plSmoke(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const TW = 256, TH = 96, NFR = 8;

  const hash = (x, y) => { const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return v - Math.floor(v); };
  const sm = t => t * t * (3 - 2 * t);
  const nz = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = sm(xf), v = sm(yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return (a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v;
  };
  const fb = (x, y) => {
    let v = 0, a = .55, px = x, py = y;
    for(let i = 0; i < 4; i++){
      v += a * nz(px, py);
      const nx = px * .8 - py * .6, ny = px * .6 + py * .8;
      px = nx * 2.03; py = ny * 2.03; a *= .5;
    }
    return v;
  };
  /* 每个玩家格用不同种子的噪声 → 图案本质不同，不只是相位错开。
     4 套 × 8 帧，启动时一次性烘焙；玩家按格子顺序轮转分配。
     套数太多会让首次加载变慢（每帧 256×96 逐像素 fbm）。 */
  const SETS = 4;
  const frameSets = [];
  for(let si = 0; si < SETS; si++){
    const SX = si * 17.31, SY = si * 9.77;     /* 种子偏移 */
    const set = [];
    for(let fi = 0; fi < NFR; fi++){
      const tt = fi / NFR;
      const c2 = document.createElement('canvas');
      c2.width = TW; c2.height = TH;
      const g2 = c2.getContext('2d');
      const im = g2.createImageData(TW, TH);
      for(let y = 0; y < TH; y++){
        for(let x = 0; x < TW; x++){
          const s = 2.6 / TH;
          const u = x * s + SX, v = y * s + SY;
          const qx = fb(u + tt * 1.6, v + tt * 1.1);
          const qy = fb(u + 5.2 - tt * 1.2, v + 1.3 + tt * 0.9);
          let val = fb(u + 2.6 * qx, v + 2.6 * qy);
          const alt = fb(u * 1.35 - tt * 2.0, v * 0.92 + tt * 1.5);
          val = val * 0.62 + alt * 0.38;
          val = (val - 0.40) / 0.30;
          val = val < 0 ? 0 : val > 1 ? 1 : val;
          const k = (y * TW + x) * 4;
          /* 黑色反转烟雾 */
          im.data[k] = im.data[k + 1] = im.data[k + 2] = 0;
          im.data[k + 3] = (val * 255) | 0;
        }
      }
      g2.putImageData(im, 0, 0);
      set.push(c2);
    }
    frameSets.push(set);
  }

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cells = [];

  function sync(){
    cells.length = 0;
    let i = 0;
    for(const c of document.querySelectorAll('.pl .plsmoke')){
      const w = c.clientWidth, h = c.clientHeight;
      i++;
      if(!w || !h) continue;
      const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
      if(c.width !== cw || c.height !== ch){ c.width = cw; c.height = ch; }
      if(!c.__ctx) c.__ctx = c.getContext('2d');
      cells.push({
        c, ctx: c.__ctx,
        /* 按格子顺序分配不同的噪声组，同一格刷新后保持不变 */
        set: c.__set || (c.__set = frameSets[(i - 1) % SETS]),
        ph: c.__ph || (c.__ph = Math.random()),
        sp: c.__sp || (c.__sp = .12 + Math.random() * .10)
      });
    }
  }

  let last = 0;
  function frame(ts){
    requestAnimationFrame(frame);
    if(ts - last < 50) return;               /* 20fps */
    const dt = last ? Math.min(ts - last, 200) : 50;
    last = ts;
    sync();
    for(const o of cells){
      o.ph = (o.ph + o.sp * dt / 1000) % 1;
      const p  = o.ph * NFR;
      const ia = Math.floor(p) % NFR, ib = (ia + 1) % NFR;
      const mixf = p - Math.floor(p);
      const g = o.ctx, W = o.c.width, H = o.c.height;
      const fs = o.set || frameSets[0];
      g.clearRect(0, 0, W, H);
      g.drawImage(fs[ia], 0, 0, W, H);
      if(mixf > .01){ g.globalAlpha = mixf; g.drawImage(fs[ib], 0, 0, W, H); g.globalAlpha = 1; }
    }
  }
  requestAnimationFrame(frame);
})();

/* 读同一份外观设置：主题色 / 背景 / 明暗自适应，跟主页保持一致 */
fetch('/api/state').then(r=>r.json()).then(st=>{
  const s = (st && st.settings) || {};
  const tint = s.theme_tint || '6,6,7';
  const rgb = String(tint).split(',').map(n => Math.max(0, Math.min(255, parseInt(n, 10) || 0)));
  const root = document.documentElement;
  root.style.setProperty('--tint', tint);
  const lum = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
  const dark = lum < 0.46;
  const set = (k, v) => root.style.setProperty(k, v);
  if(dark){
    set('--txt', '#e9eaec'); set('--dim', '#8f8d89');
    set('--rule', 'rgba(255,255,255,.15)'); set('--rule-soft', 'rgba(255,255,255,.07)');
    set('--ov1', 'rgba(255,255,255,.06)');  set('--ov2', 'rgba(255,255,255,.12)');
  } else {
    set('--txt', '#17171a'); set('--dim', '#5b5955');
    set('--rule', 'rgba(0,0,0,.20)'); set('--rule-soft', 'rgba(0,0,0,.10)');
    set('--ov1', 'rgba(0,0,0,.05)');  set('--ov2', 'rgba(0,0,0,.10)');
  }
  root.dataset.theme = dark ? 'dark' : 'light';
  /* 地图底：亮主题下把雷达底换成主题色的深色版（×0.24），避免一整块纯黑突兀 */
  window.__mapBg = dark ? '#0a0a0b'
    : '#' + rgb.map(v => Math.round(v * 0.24).toString(16).padStart(2, '0')).join('');
  try { draw(); } catch(e){}
}).catch(()=>{});

</script></html>
