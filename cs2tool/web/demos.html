<!doctype html><html lang="zh"><meta charset="utf-8">
<title>Demo 与逐场记录 · Cross-Section</title>
<link rel="stylesheet" href="/style.css">
<style>
#dnav{display:flex;align-items:center;gap:14px;
  padding:12px max(20px,calc((100vw - 1760px)/2));
  border-bottom:1px solid var(--line);background:var(--bg);
  position:sticky;top:0;z-index:5}
#dnav h1{font-size: 18px;margin:0;font-weight:650}
#dnav a{font-size: 13px;color:var(--dim)}
#dnav a:hover{color:var(--txt)}
/* ===== 分节：和主页一致的大标题层级 ===== */
.wrap{counter-reset:sec}
.sec{counter-increment:sec;position:relative;margin-bottom:48px;padding-top:6px}
.sec>h2{display:flex;align-items:center;gap:14px;position:relative;
  font-size: 24px;font-weight:600;letter-spacing:-.015em;color:var(--txt);
  text-transform:none;margin:0 0 18px;line-height:1.2}
.sec>h2::before{content:counter(sec,decimal-leading-zero);
  position:absolute;left:-30px;top:50%;transform:translateY(-50%);
  font-size: 18px;font-weight:600;color:var(--acc);opacity:.5;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;
  pointer-events:none}
.sec>h2::after{content:'';order:1;flex:1;height:1px;min-width:24px;
  background:linear-gradient(to right,rgba(255,255,255,.13),rgba(255,255,255,0))}
.sec>h2 .r{order:2;flex:none;font-size: 13px;font-weight:400;color:var(--dim);
  letter-spacing:0;text-transform:none}
/* 表：地图列带文件小字 */
.gmap{line-height:1.25}
.gmap .mn{font-size: 13px}
.gmap .fs{font-size: 12px;color:var(--dim);opacity:.7;margin-top:1px}
.tb .op a,.tb .op button{font-size: 13px;padding:0}
/* 行内操作：回放 / 重解析 / 移除，三个并排，删除 hover 才变红 */
.tb .op{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.tb .op .mini{border:0;background:none;color:var(--dim);cursor:pointer;
  font-size: 13px;line-height:1;padding:2px 0}
.tb .op .mini:hover{color:var(--txt)}
.tb .op .mini.del{font-size: 14px}
.tb .op .mini.del:hover{color:var(--bad)}
/* 拉取配置自检：细框 + 两列（对勾/说明），结论单独一行 */
#pullDiag{margin-top:12px;border:1px solid var(--line);border-radius:6px;
  padding:12px 15px 13px;background:rgba(255,255,255,.018);font-size:13px;line-height:1.9}
#pullDiag .dg{display:grid;grid-template-columns:16px 1fr;gap:1px 8px}
#pullDiag .dg i{font-style:normal;text-align:center}
#pullDiag .dg .nm{color:var(--dim);margin-right:8px}
#pullDiag .ok{color:var(--ok)}
#pullDiag .bad{color:var(--bad)}
#pullDiag .inf{color:var(--dim)}
#pullDiag .vd{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}
#pullDiag .vd.bad{color:var(--bad)}
/* 危险操作：推到最右，红色描边，hover 反白 */
#btnResetAll{margin-left:auto;color:var(--bad);border-color:#3a2222}
#btnResetAll:hover{background:rgba(255,107,107,.14);border-color:var(--bad);color:#fff}
/* 页脚声明 */
#foot{margin-top:64px;padding:20px 0 8px;border-top:1px solid rgba(255,255,255,.05);
  text-align:center}
#foot .fline{font-size: 12px;color:var(--dim);opacity:.55;display:flex;gap:8px;
  align-items:center;justify-content:center;flex-wrap:wrap}
#foot a{color:var(--dim);font-size: 12px}
#foot a:hover{color:var(--txt);opacity:1}
#foot .sep{opacity:.4}
#foot .fdis{margin:12px auto 0;max-width:860px;font-size: 12px;line-height:1.9;
  color:var(--dim);opacity:.62;letter-spacing:.01em}
#foot .fdis span{display:block}
#foot .fdis span+span{margin-top:2px}
#foot .fdis code{font-size: 12px;background:none;padding:0}
/* 双进度条：靠左窄标签 + 细条 + 右侧读数，不用外框 */
.prow{display:grid;grid-template-columns:44px 1fr 92px;align-items:center;gap:10px;
  margin-bottom:6px}
.prow .pk{font-size: 12px;color:var(--dim)}
.prow .pv{font-size: 12px;color:var(--dim);text-align:right;
  font-variant-numeric:tabular-nums}
.pbar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.pbar.thin{height:2px}
/* --tint 是 RGB 三元组（6,6,7），不能直接当颜色值用，否则是非法声明、填充层透明，
   进度条看起来永远不动。这里跟顶栏解析进度条保持一致，用 --warn。 */
.pbar i{display:block;height:100%;width:0;background:var(--warn);
  transition:width .3s ease}
.tb{width:100%;border-collapse:collapse;font-size: 13px}
.tb th{text-align:left;font-weight:500;color:var(--dim);font-size: 12px;
  padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.045)}
.tb tr:last-child td{border-bottom:0}
.tb tr:hover td{background:rgba(255,255,255,.028)}
.tb .num{text-align:right;font-variant-numeric:tabular-nums;font-family:inherit}
.tb .w{color:var(--ok)}.tb .l{color:var(--bad)}.tb .d{color:var(--dim)}.tb .m{color:var(--dim)}
.tb .ot{font-size: 12px;color:var(--warn,#d8a83c);margin-left:5px;letter-spacing:.04em}
.nil{color:var(--dim);font-size: 13px;padding:18px 0;text-align:center}
.mbtr{width:70px;background:rgba(255,255,255,.07);border-radius:3px;display:inline-block;
  height:5px;vertical-align:middle;overflow:hidden}
.mb{display:inline-block;height:5px;border-radius:3px;background:var(--acc);opacity:.5;
  vertical-align:middle;min-width:2px}
</style>

<canvas id="smoke"></canvas>
<div id="dnav">
  <h1><span class="xb" data-alt="Counter-Strike" aria-label="Cross-Section">
    <span class="xb-c">C</span><span class="xb-m1">ross-</span><span class="xb-s">S</span><span class="xb-m2">ection</span>
    <span class="xb-alt" aria-hidden="true">Counter-Strike</span>
  </span></h1>
  <a href="/">← 返回分析</a>
  <span style="flex:1"></span>
  <!-- 后端版本：覆盖代码后没重启，这里会跟页面自报的版本对不上，一眼能看出来 -->
  <span class="muted" id="dver" style="font-size: 12px;opacity:.6"></span>
  <span id="job"><span id="jobtext">解析中…</span><span class="prog"><i id="progbar"></i></span></span>
  <select id="player" title="选择「我」是谁"></select>
</div>

<div class="wrap">

  <div class="sec">
    <h2>数据操作</h2>
    <div class="card"><div class="bd">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button id="btnPull">⇩ 从 CS2 拉取</button>
        <!-- AutoPull：只在装了增量包时出现（后端 /api/state 的 gc_pull=true）-->
        <button id="apRecent" hidden title="从 Game Coordinator 取最近比赛并直接下载">⇣ AutoPull · 最近比赛</button>
        <button id="btnScan">扫描目录</button>
        <button id="btnAnalyze">分析未处理</button>
        <button id="btnReparse" title="把所有 demo 从头重新解析一遍（清空现有分析结果）">⟲ 全部重新解析</button>
        <button id="btnExportCsv">导出完整 CSV</button>
        <button id="btnResetAll" title="清空所有分析数据、缓存、导出和设置（demo 原始文件不删）">⌫ 全部删除</button>
      </div>

      <!-- AutoPull 的分享码区：按场补历史，只在装了增量包时出现 -->
      <div id="apPanel" hidden style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line, rgba(255,255,255,.08))">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
          <span style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim, #8b8b8f)">AutoPull · 分享码</span>
          <span id="apStatus" style="font-size:12.5px;color:var(--dim, #8b8b8f)"></span>
        </div>
        <textarea id="apCodes" rows="3" spellcheck="false"
          placeholder="CSGO-xxxxx-xxxxx-xxxxx-xxxxx-xxxxx　一行一个，多早的场次都行"
          style="width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;line-height:1.7;
                 background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);
                 border-radius:3px;padding:8px 10px;color:inherit;resize:vertical"></textarea>
        <div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap">
          <button id="apByCodes">⇣ 按分享码下载</button>
          <small style="color:var(--dim, #8b8b8f);font-size:12px">从比赛历史页每场的「分享」复制。每场约 10 秒（要问一次 GC）。用前先退出 CS2。</small>
        </div>
      </div>

      <div class="hint" id="opHint"></div>
      <!-- 拉取配置自检结果：点「🔍 检查拉取配置」或拉取失败时自动出现 -->
      <div id="pullDiag" hidden></div>
      <div id="pullBar" hidden style="margin-top:10px">
        <!-- 双进度：上面是总场次，下面是当前这一场的字节进度 -->
        <div class="prow">
          <span class="pk">总场次</span>
          <div class="pbar"><i id="pullFill"></i></div>
          <span class="pv" id="pullFillTxt"></span>
        </div>
        <div class="prow">
          <span class="pk">本场</span>
          <div class="pbar thin"><i id="pullFillOne"></i></div>
          <span class="pv" id="pullFillOneTxt"></span>
        </div>
        <div class="muted" id="pullMsg" style="font-size: 12px;margin-top:7px"></div>
      </div>
      <div class="muted" id="pullLast" style="font-size: 12px;margin-top:10px"></div>
    </div></div>
  </div>

  <div class="sec">
    <h2>对局 <span class="r" id="gameSub"></span></h2>
    <div class="card"><div class="bd np">
      <div class="muted" id="demoPath" style="padding:10px 16px;font-size: 12px;
        border-bottom:1px solid var(--line)"></div>
      <div id="gameTable"></div>
    </div></div>
  </div>

  <footer id="foot">
    <div class="fline">
      <a href="/about.html">简介 · 使用说明</a>
      <span class="sep">·</span>
      <a href="/">← 返回分析</a>
      <span class="sep">·</span>
      <span>QQ 1470232252</span>
    </div>
    <p class="fdis">
      <span>基于 <b>awpy 3.1.1</b>（MIT License）构建，demo 解析层由 awpy 提供</span>
      <span>统计口径参考 HLTV 公开公式（Rating 2.0 / Impact / KAST / ADR）</span>
      <span>指标计算、前端界面与本地服务为本项目自研</span>
    </p>
  </footer>

</div>

<script src="/player-select.js"></script>
<script src="/demos.js"></script>
<script src="/smoke.js"></script>
<script src="/brand.js"></script>
